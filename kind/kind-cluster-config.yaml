kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: observability-cluster
nodes:
  - role: control-plane
    image: kindest/node:v1.29.2
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      # Grafana Web UI NodePort
      - containerPort: 30000
        hostPort: 30000
        protocol: TCP
      # Prometheus Web UI NodePort
      - containerPort: 30090
        hostPort: 30090
        protocol: TCP
      # Alertmanager Web UI NodePort
      - containerPort: 30093
        hostPort: 30093
        protocol: TCP
      # Sample App Frontend NodePort
      - containerPort: 30080
        hostPort: 30080
        protocol: TCP
      # Sample App Backend NodePort / Metrics
      - containerPort: 30081
        hostPort: 30081
        protocol: TCP
      # Standard HTTP / Ingress
      - containerPort: 80
        hostPort: 80
        protocol: TCP
      # Standard HTTPS / Ingress
      - containerPort: 443
        hostPort: 443
        protocol: TCP
  - role: worker
    image: kindest/node:v1.29.2
  - role: worker
    image: kindest/node:v1.29.2
