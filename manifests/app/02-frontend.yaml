apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-config
  namespace: app
  labels:
    app: frontend
data:
  nginx.conf: |
    server {
        listen 80;
        server_name localhost;

        location / {
            root /usr/share/nginx/html;
            index index.html index.htm;
            try_files $uri $uri/ /index.html;
        }

        location /api/ {
            proxy_pass http://backend-service.app.svc.cluster.local:8080/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /healthz {
            return 200 'OK';
            add_header Content-Type text/plain;
        }
    }

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deployment
  namespace: app
  labels:
    app: frontend
    tier: web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
        tier: web
    spec:
      containers:
        - name: frontend
          image: nginx:alpine-slim
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
          volumeMounts:
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: nginx.conf
            - name: app-code
              mountPath: /usr/share/nginx/html/index.html
              subPath: index.html
      volumes:
        - name: nginx-conf
          configMap:
            name: frontend-config
        - name: app-code
          configMap:
            name: frontend-html

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-html
  namespace: app
  labels:
    app: frontend
data:
  index.html: |
    <!DOCTYPE html>
    <html lang="en">
    <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <title>Kubernetes Observability & Monitoring Demo</title>
      <link rel="preconnect" href="https://fonts.googleapis.com">
      <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
      <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
      <style>
        :root {
          --bg: #0b0f19;
          --card-bg: rgba(18, 26, 43, 0.75);
          --card-border: rgba(255, 255, 255, 0.08);
          --primary: #3b82f6;
          --primary-glow: rgba(59, 130, 246, 0.35);
          --accent: #10b981;
          --warning: #f59e0b;
          --danger: #ef4444;
          --text: #f3f4f6;
          --text-muted: #9ca3af;
          --font-main: 'Outfit', sans-serif;
          --font-mono: 'JetBrains Mono', monospace;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
          background: radial-gradient(circle at 10% 20%, #1e1b4b 0%, var(--bg) 80%);
          color: var(--text);
          font-family: var(--font-main);
          min-height: 100vh;
          padding: 2rem;
          display: flex;
          flex-direction: column;
          align-items: center;
        }
        .container { max-width: 1100px; width: 100%; }
        header { text-align: center; margin-bottom: 2.5rem; }
        .badge {
          display: inline-flex; align-items: center; gap: 0.5rem;
          background: rgba(59, 130, 246, 0.15); color: #60a5fa;
          padding: 0.35rem 0.85rem; border-radius: 9999px;
          font-size: 0.85rem; font-weight: 500;
          border: 1px solid rgba(59, 130, 246, 0.3); margin-bottom: 1rem;
        }
        .badge-dot {
          width: 8px; height: 8px; border-radius: 50%;
          background: var(--accent); box-shadow: 0 0 8px var(--accent);
        }
        h1 {
          font-size: 2.5rem; font-weight: 700; letter-spacing: -0.02em;
          margin-bottom: 0.5rem;
          background: linear-gradient(135deg, #ffffff 0%, #94a3b8 100%);
          -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        p.subtitle { color: var(--text-muted); font-size: 1.1rem; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 1.5rem; margin-bottom: 2rem; }
        .card {
          background: var(--card-bg); backdrop-filter: blur(16px);
          border: 1px solid var(--card-border); border-radius: 16px;
          padding: 1.75rem; box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.5);
        }
        .card-title { font-size: 1.25rem; font-weight: 600; margin-bottom: 1rem; display: flex; align-items: center; gap: 0.6rem; }
        .btn-group { display: flex; flex-wrap: wrap; gap: 0.75rem; margin-top: 1.25rem; }
        button, .link-btn {
          background: rgba(255, 255, 255, 0.06); color: var(--text);
          border: 1px solid rgba(255, 255, 255, 0.12);
          padding: 0.65rem 1.1rem; border-radius: 8px;
          font-family: var(--font-main); font-size: 0.9rem; font-weight: 500;
          cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 0.5rem; transition: all 0.2s;
        }
        button:hover, .link-btn:hover { background: rgba(255, 255, 255, 0.12); transform: translateY(-1px); }
        button.primary, .link-btn.primary { background: var(--primary); border-color: var(--primary); box-shadow: 0 4px 14px var(--primary-glow); }
        button.danger { background: rgba(239, 68, 68, 0.2); border-color: rgba(239, 68, 68, 0.4); color: #fca5a5; }
        button.warning { background: rgba(245, 158, 11, 0.2); border-color: rgba(245, 158, 11, 0.4); color: #fcd34d; }
        .log-box {
          background: #060911; border: 1px solid rgba(255, 255, 255, 0.08);
          border-radius: 8px; padding: 1rem; font-family: var(--font-mono);
          font-size: 0.85rem; max-height: 220px; overflow-y: auto; color: #a7f3d0; margin-top: 1rem; white-space: pre-wrap;
        }
        .stats { display: flex; justify-content: space-between; margin-top: 1rem; padding: 0.75rem; background: rgba(0, 0, 0, 0.2); border-radius: 8px; }
        .stat-item { text-align: center; }
        .stat-val { font-size: 1.4rem; font-weight: 700; color: #60a5fa; }
        .stat-lbl { font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; }
        footer { text-align: center; margin-top: 3rem; color: var(--text-muted); font-size: 0.85rem; }
      </style>
    </head>
    <body>
      <div class="container">
        <header>
          <div class="badge"><span class="badge-dot"></span> Cluster: Kind Multi-Node (v1.29)</div>
          <h1>Kubernetes Observability Stack</h1>
          <p class="subtitle">Live Prometheus Metrics & Grafana Dashboards</p>
        </header>
        <div class="grid">
          <div class="card">
            <div class="card-title"><span>📊</span> Observability Links</div>
            <p style="color: var(--text-muted); font-size: 0.9rem;">Access monitoring dashboards:</p>
            <div class="btn-group">
              <a href="http://localhost:30000" target="_blank" class="link-btn primary">📈 Grafana (:30000)</a>
              <a href="http://localhost:30090" target="_blank" class="link-btn">🔥 Prometheus (:30090)</a>
              <a href="http://localhost:30093" target="_blank" class="link-btn">🚨 Alertmanager (:30093)</a>
            </div>
          </div>
          <div class="card">
            <div class="card-title"><span>🎯</span> Traffic & Metrics Simulator</div>
            <p style="color: var(--text-muted); font-size: 0.9rem;">Trigger real-time requests for metrics:</p>
            <div class="btn-group">
              <button onclick="sendRequest('/api/data')">200 OK Request</button>
              <button class="warning" onclick="sendRequest('/api/slow')">Latency Request</button>
              <button class="danger" onclick="sendRequest('/api/error')">500 Error Request</button>
            </div>
            <div class="stats">
              <div class="stat-item"><div id="stat-reqs" class="stat-val">0</div><div class="stat-lbl">Requests</div></div>
              <div class="stat-item"><div id="stat-latency" class="stat-val">0 ms</div><div class="stat-lbl">Avg Latency</div></div>
              <div class="stat-item"><div id="stat-errs" class="stat-val">0</div><div class="stat-lbl">Errors</div></div>
            </div>
          </div>
        </div>
        <div class="card" style="width: 100%;">
          <div class="card-title"><span>📜</span> Live Response Telemetry</div>
          <div id="log-output" class="log-box">[System Ready] Telemetry pipeline active...</div>
        </div>
        <footer>Kubernetes Monitoring & Observability Stack &bull; Kind &bull; Helm &bull; Prometheus &bull; Grafana</footer>
      </div>
      <script>
        let reqCount = 0, errCount = 0, totalLatency = 0;
        async function sendRequest(path) {
          const start = performance.now();
          try {
            const res = await fetch(path);
            const latency = Math.round(performance.now() - start);
            const data = await res.json();
            reqCount++; totalLatency += latency;
            if (!res.ok) errCount++;
            updateStats();
            appendLog(`[${new Date().toLocaleTimeString()}] GET ${path} -> HTTP ${res.status} (${latency}ms)\n${JSON.stringify(data, null, 2)}`);
          } catch (err) {
            reqCount++; errCount++;
            const latency = Math.round(performance.now() - start);
            updateStats();
            appendLog(`[${new Date().toLocaleTimeString()}] GET ${path} -> FAILED: ${err.message}`);
          }
        }
        function updateStats() {
          document.getElementById('stat-reqs').innerText = reqCount;
          document.getElementById('stat-errs').innerText = errCount;
          document.getElementById('stat-latency').innerText = Math.round(totalLatency / (reqCount || 1)) + ' ms';
        }
        function appendLog(text) {
          const logBox = document.getElementById('log-output');
          logBox.innerText = text + '\n\n' + logBox.innerText;
        }
      </script>
    </body>
    </html>

---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: app
  labels:
    app: frontend
    tier: web
spec:
  type: NodePort
  selector:
    app: frontend
  ports:
    - name: http
      port: 80
      targetPort: 80
      nodePort: 30080
      protocol: TCP
